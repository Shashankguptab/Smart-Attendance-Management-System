{% extends "attendance/base.html" %}

{% block content %}

<div class="form-card">

    <h1>Login</h1>

    <p class="page-description">
        Sign in to access AttendEase.
    </p>

    {% if form.errors %}

    <div class="error">
        Invalid username or password.
    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Username</label>

            {{ form.username }}

        </div>

        <div class="form-group">

            <label>Password</label>

            {{ form.password }}

        </div>

        <button type="submit" class="btn" style="width:100%;">
            Login
        </button>

    </form>

</div>

{% endblock %}
